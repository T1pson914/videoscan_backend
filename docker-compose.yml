services:
  db:
    image: postgres
    container_name: db
    ports: ["5432:5432"]
    environment:
      - POSTGRES_PASSWORD=2310
    volumes:
      - videoscan_db:/var/lib/postgresql
  redis:
    image: redis
    container_name: redis
    ports: ["6379:6379"]


volumes:
  videoscan_db:
    external: true
